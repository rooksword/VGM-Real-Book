<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>VGM Real Book</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="sidebar">
        <h1 style="color: white; display:inline">VGM Real Book</h1>
        <div id="instrument-buttons">
            <button data-inst="C" class="active">C</button>
            <button data-inst="Bb">B♭</button>
            <button data-inst="Eb">E♭</button>
            <button data-inst="bass">Bass</button>
        </div>

        <div id="octave-controls">
            <button id="octave-down">Octave ▼</button>
            <span id="octave-label">0</span>
            <button id="octave-up">Octave ▲</button>
          </div>

        <div id="score-links"></div>
    </div>
    

    <div id="scorecontainer">
        <div id="score"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
